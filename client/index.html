<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDT: Performance & Development Tracker</title>

    <!-- Applied before first paint, so it must be a plain blocking script: anything
         running after React mounts paints the default colours first and visibly snaps.
         The key and class name are repeated in ThemeProvider.jsx and MUST agree. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("pdt-theme");
          document.documentElement.classList.toggle("dark", saved !== "light");
        } catch (e) {
          /* Storage blocked (private mode, cookies disabled): fall back to the default. */
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
